<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>{% block title %}CBT Minischool{% endblock %}</title>
  <link href="{{ url_for('static', filename='dist/output.css') }}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .material-symbols-outlined,
    .material-symbols-rounded,
    .material-symbols-sharp {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(17, 115, 212, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(17, 115, 212, 0); }
      100% { box-shadow: 0 0 0 0 rgba(17, 115, 212, 0); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); max-height: 0; }
      to { opacity: 1; transform: translateY(0); max-height: 300px; }
    }

    @keyframes checkmark {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out both; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out both; }
    .animate-shake { animation: shake 0.4s ease-out; }
    .animate-slide-down { animation: slideDown 0.35s ease-out both; }
    .animate-checkmark { animation: checkmark 0.3s ease-out both; }
    .animate-pulse-ring { animation: pulse-ring 1.5s infinite; }

    .card-enter { animation: fadeInUp 0.5s ease-out both; }
    .card-enter:nth-child(2) { animation-delay: 0.1s; }
    .card-enter:nth-child(3) { animation-delay: 0.2s; }

    .strength-bar {
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
      font-size: 20px;
    }

    .dark .input-icon-left { color: #6b7280; }

    input:focus ~ .input-icon-left,
    select:focus ~ .input-icon-left {
      color: #1173d4;
    }

    .input-with-icon {
      padding-left: 44px !important;
    }

    .role-panel-transition {
      transition: opacity 0.3s ease, transform 0.3s ease, max-height 0.3s ease;
    }

    .file-upload-zone {
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .file-upload-zone:hover,
    .file-upload-zone.drag-over {
      border-color: #1173d4 !important;
      background-color: rgba(17, 115, 212, 0.04);
    }

    .dark .file-upload-zone:hover,
    .dark .file-upload-zone.drag-over {
      background-color: rgba(17, 115, 212, 0.1);
    }

    .form-input,
    .form-select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    input.error-class,
    select.error-class {
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.15) !important;
    }
    .bg-subtle-pattern {
      background-image:
        radial-gradient(circle at 20% 50%, rgba(17, 115, 212, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.02) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(99, 102, 241, 0.02) 0%, transparent 50%);
    }

    .dark .bg-subtle-pattern {
      background-image:
        radial-gradient(circle at 20% 50%, rgba(17, 115, 212, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(99, 102, 241, 0.04) 0%, transparent 50%);
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes watermarkFloat {
      0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
      50% { transform: translateY(-16px) rotate(var(--r, 0deg)); }
    }

    .animate-shimmer {
      background-size: 300% 100%;
      animation: shimmer 4s ease-in-out infinite;
    }

    .watermark-icon {
      position: absolute;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      line-height: 1;
    }
  </style>
</head>

<body class="bg-white dark:bg-[#0f1419] font-sans antialiased">
  <div class="relative flex min-h-screen w-full flex-col bg-white dark:bg-[#0f1419] overflow-x-hidden bg-subtle-pattern">
    {% block content %}
    {% endblock %}
  </div>

  {% block scripts %}
  {% endblock %}

</body>

</html>
