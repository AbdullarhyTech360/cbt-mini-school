[project]
name = "cbt-minischool"
version = "1.0.0"
description = "Default template for PDM package"
authors = [
    {name = "abdullahi", email = "abdullahimaikidandan@gmail.com"},
]
dependencies = ["flask>=3.1.2", "flask-sqlalchemy>=3.1.1", "sqlalchemy>=2.0.44", "flask-bcrypt>=1.0.1", "python-docx>=1.2.0", "weasyprint>=67.0", "xhtml2pdf>=0.2.17", "xlsxwriter>=3.2.9", "cryptography>=42.0.0", "requests>=2.34.2", "pytesseract>=0.3.13", "pdf2image>=1.17.0", "pillow>=12.2.0", "google-generativeai>=0.8.6", "google-genai>=2.0.0", "mcp-server-sqlite>=2025.4.25"]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
flask = "python app.py"
# Updated to use the correct input.css path and integrate font rebuilding
css = "npx tailwindcss -i ./app/static/css/input.css -o ./static/dist/output.css --watch"
# Consolidated CSS compilation and Material Symbols font management
css-with-fonts = "node scripts/watch-fonts.js"
dev = "npx concurrently -n FLASK,TAILWIND,FONTS -c blue,green,yellow \"pdm run flask\" \"pdm run css\" \"pdm run css-with-fonts\""
[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]
